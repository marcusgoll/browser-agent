name: Autopilot Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    name: canonical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Build canonical browser-agent image
        run: docker compose build browser-agent
      - name: Create isolated CI network required by Compose
        run: docker network create --internal social-media-agent_social-agent-network
      - name: Run canonical repository tests
        run: docker compose run --rm browser-agent scripts/run_tests.py
