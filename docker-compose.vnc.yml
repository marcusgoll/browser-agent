services:
  browser-agent-vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    container_name: browser-agent-vnc
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-sonnet-4}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BROWSER_PROFILE_DIR=/app/profiles
      - OUTPUT_DIR=/app/output
      - DISPLAY=:99
    volumes:
      - ./profiles:/app/profiles:rw
      - ./output:/app/output:rw
      - ./scripts:/app/scripts:ro
      - ./tasks:/app/tasks:ro
    ports:
      - "5900:5900"
    networks:
      - browser-agent-network
      - social-media-agent_social-agent-network
    restart: unless-stopped

networks:
  browser-agent-network:
    driver: bridge
  social-media-agent_social-agent-network:
    external: true
